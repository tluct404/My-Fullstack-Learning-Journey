<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swimmer card</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      color: #1a1a1a;
      background-color: #eef2f5;
      margin: 0;
      padding: 40px;
    }

    .swimmer-card {
      display: flex;
      flex-direction: column;
      gap: 16px;

      background-color: #ffffff;
      padding: 24px;
      border: 1px solid #d4dde5;
      max-width: 360px;
      margin: 0 auto;
    }

    .card-header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;

    }

    .name {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
    }

    .age {
      background-color: #e0e7ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 100px;
    }

    .events {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: left;
    }

    .event {
      background-color: #f1f5f9;
      color: #334155;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .goal {
      font-size: 14px;
      color: #475569;
      margin: 0;
    }

    .goal strong {
      color: #1a1a1a;
    }
  </style>
</head>
<body>
  <div class="swimmer-card">
    
    <div class="card-header">
      <h2 class="name">Ava Chen</h2>
      <span class="age">Age 18</span>
    </div>

    <div class="events">
      <span class="event">50m Free</span>
      <span class="event">100m Free</span>
      <span class="event">100m Fly</span>
    </div>

    <p class="goal">
      <strong>Goal: </strong> Break 30s in the 50m freestyle
    </p>
  </div>
</body>
</html>
